[project]
name = "cept"
version = "0.1.0"
description = "Proprioception for coding agents — slice recent Claude Code transcript, redact, send to Perplexity, return structured steering guidance."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eidos AGI" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
cept = "cept.server:main"
cept-cli = "cept.cli:main"
cept-keyfile = "cept.keyfile_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cept"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
